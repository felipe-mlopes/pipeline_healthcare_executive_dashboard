name: CI

on:
    pull_request: 
        branches: [main]
    push: 
        branches-ignore: [main]

jobs:
    lint-and-test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-python@v5
              with:
                python-version: "3.11"
                cache: "pip"
            
            - name: Instalar dependências
              run: pip install -r requirements-dev.txt

            - name: Lint (ruff)
              run: ruff check .

            - name: Testes (pytest)
              env:
                GCP_PROJECT_ID: ci-dummy-project
              run: pytest -q --cov=. --cov-report=term-missing

            - name: Build de validação da imagem Docker
              run: docker build -t pipeline-ci:${{ github.sha }} .